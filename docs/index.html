<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mi Sitio en GitHub Pages</title>
  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --text: #f8fafc;
      --muted: #94a3b8;
      --accent: #38bdf8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 1.5rem;
    }

    main {
      background-color: var(--card);
      max-width: 560px;
      width: 100%;
      padding: 2.5rem;
      border-radius: 1rem;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.4);
      text-align: center;
      border: 1px solid rgba(255, 255, 255, 0.08);
    }

    .badge {
      display: inline-block;
      background: rgba(56, 189, 248, 0.15);
      color: var(--accent);
      font-size: 0.85rem;
      font-weight: 600;
      padding: 0.35rem 0.85rem;
      border-radius: 999px;
      margin-bottom: 1.25rem;
    }

    h1 {
      font-size: 1.85rem;
      margin-bottom: 0.75rem;
    }

    p {
      color: var(--muted);
      line-height: 1.6;
      margin-bottom: 1.75rem;
    }

    a.btn {
      display: inline-block;
      background-color: var(--accent);
      color: #0f172a;
      text-decoration: none;
      font-weight: 600;
      padding: 0.75rem 1.5rem;
      border-radius: 0.5rem;
      transition: opacity 0.2s ease;
    }

    a.btn:hover {
      opacity: 0.9;
    }
  </style>
</head>
<body>
  <main>
    <span class="badge">Despliegue activo</span>
    <h1>¡Hola desde GitHub Pages!</h1>
    <p>
      Si estás viendo esta página, tu repositorio está correctamente configurado y publicado.
      Ya puedes reemplazar este contenido con tu propio proyecto.
    </p>
    <a class="btn" href="https://github.com" target="_blank" rel="noopener">
      Ir a GitHub
    </a>
  </main>
</body>
</html>
